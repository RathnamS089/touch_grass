[package]
name = "grounded"
version = "0.1.0"
description = "Grounded desktop companion UI foundation"
authors = ["Grounded"]
edition = "2021"

[lib]
name = "grounded_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
